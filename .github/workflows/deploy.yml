name: Deploy to production

# Deploys the theme over FTPS on every push to main, plus the handful of files
# that must live at the web root rather than inside the theme folder.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER    host name or IP, e.g. rapidtechsolutions.au
#   FTP_USERNAME  FTP account user
#   FTP_PASSWORD  FTP account password
#
# Optional repository variables (same screen, "Variables" tab):
#   FTP_PROTOCOL   ftps (default) or ftp
#   THEME_DIR      remote theme path
#                  (default /public_html/wp-content/themes/rapidtech-theme/)
#   WEBROOT_DIR    remote document root (default /public_html/)
#
# Credentials are never committed. Rotate the FTP password if it has ever been
# pasted into a chat, an issue or a commit message.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List changes without uploading'
        type: boolean
        default: true

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  lint:
    name: Lint PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      # A parse error shipped over FTP takes the page down with a blank white
      # screen, so this gate runs before anything is uploaded.
      - name: Syntax-check every PHP file
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            php -l "$f" > /dev/null || { echo "::error file=$f::PHP syntax error"; fail=1; }
          done < <(find rapidtech-theme -name '*.php' -print0)
          exit $fail

      # The theme routes its own URLs. If a slug loses its rewrite rule the
      # page silently falls through to the homepage, which is exactly the
      # failure that made 74 sitemap URLs serve identical content.
      - name: Verify every sitemap URL has a route
        run: php rapidtech-theme/tools/test-routes.php

      - name: Validate JSON-LD and sitemap
        run: |
          php rapidtech-theme/tools/build-sitemap.php
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, sys
          ET.parse('deploy/webroot/sitemap.xml')
          print('sitemap.xml parses')
          PY
          if ! git diff --quiet -- deploy/webroot/sitemap.xml; then
            echo "::warning::sitemap.xml is out of date — run tools/build-sitemap.php and commit"
          fi

  deploy-theme:
    name: Upload theme
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy theme via FTP (Python)
        shell: python
        run: |
          import ftplib, os, sys, fnmatch
          server = "${{ secrets.FTP_SERVER }}"
          user = "${{ secrets.FTP_USERNAME }}"
          pwd = "${{ secrets.FTP_PASSWORD }}"
          remote = "${{ vars.THEME_DIR || '/public_html/wp-content/themes/rapidtech-theme/' }}"
          local = "rapidtech-theme"
          exclude = [".git", "node_modules", "tools", "*.md", ".DS_Store", ".gitignore"]
          print(f"Connecting to {server} as {user}...")
          try:
              ftp = ftplib.FTP()
              ftp.connect(server, 21, timeout=30)
              ftp.login(user, pwd)
              print(f"Connected. Uploading to {remote}...")
              for root, dirs, files in os.walk(local):
                  skip = any(fnmatch.fnmatch(root, f"*/{e}") or fnmatch.fnmatch(root, f"{local}/{e}") for e in exclude if "/" not in e)
                  dirs[:] = [d for d in dirs if d not in exclude]
                  if skip: continue
                  rel = os.path.relpath(root, local).replace("\\", "/")
                  target = remote.rstrip("/") + "/" + rel if rel != "." else remote.rstrip("/")
                  try: ftp.cwd(target)
                  except: ftp.mkd(target); ftp.cwd(target)
                  for f in files:
                      if any(fnmatch.fnmatch(f, e) for e in exclude): continue
                      local_path = os.path.join(root, f)
                      print(f"  {rel}/{f}" if rel != "." else f"  {f}")
                      with open(local_path, "rb") as fh:
                          ftp.storbinary(f"STOR {f}", fh)
              ftp.quit()
              print("Theme upload complete.")
          except Exception as e:
              print(f"FTP ERROR: {e}", file=sys.stderr)
              sys.exit(1)

  deploy-webroot:
    name: Upload web-root files
    needs: deploy-theme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # robots.txt, sitemap.xml, the Google verification file and the canonical
      # .htaccess are only ever read from the document root. They lived inside
      # the theme folder previously, where no crawler could reach them.
      - name: Deploy web-root files via FTP (Python)
        shell: python
        run: |
          import ftplib, os, sys
          server = "${{ secrets.FTP_SERVER }}"
          user = "${{ secrets.FTP_USERNAME }}"
          pwd = "${{ secrets.FTP_PASSWORD }}"
          remote = "${{ vars.WEBROOT_DIR || '/public_html/' }}"
          local = "deploy/webroot"
          print(f"Connecting to {server} as {user}...")
          try:
              ftp = ftplib.FTP()
              ftp.connect(server, 21, timeout=30)
              ftp.login(user, pwd)
              print(f"Connected. Uploading webroot files to {remote}...")
              ftp.cwd(remote.rstrip("/"))
              for f in os.listdir(local):
                  local_path = os.path.join(local, f)
                  if os.path.isfile(local_path):
                      print(f"  {f}")
                      with open(local_path, "rb") as fh:
                          ftp.storbinary(f"STOR {f}", fh)
              ftp.quit()
              print("Webroot upload complete.")
          except Exception as e:
              print(f"FTP ERROR: {e}", file=sys.stderr)
              sys.exit(1)
